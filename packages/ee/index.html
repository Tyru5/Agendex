<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@350;400;450;500;550;600&family=Unbounded:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Agendex Pro</title>
  </head>
  <body>
    <script>
      (() => {
        var t = localStorage.getItem("agendex.theme") || "system";
        var d = t === "system"
          ? window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
          : t;
        document.documentElement.classList.add(d);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
