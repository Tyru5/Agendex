<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="One dashboard for every coding agent. Agendex indexes plans from Claude Code, Cursor, Codex, and more into a single searchable interface." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="canonical" href="https://agendex.dev" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Agendex Pro — One dashboard for every coding agent" />
    <meta property="og:description" content="Index, search, share, and track plans from Claude Code, Cursor, Codex, and 15+ AI coding agents in one place." />
    <meta property="og:url" content="https://agendex.dev" />
    <meta property="og:image" content="https://agendex.dev/og-image.png" />
    <meta property="og:site_name" content="Agendex" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Agendex Pro — One dashboard for every coding agent" />
    <meta name="twitter:description" content="Index, search, share, and track plans from Claude Code, Cursor, Codex, and 15+ AI coding agents in one place." />
    <meta name="twitter:image" content="https://agendex.dev/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@350;400;450;500;550;600&family=Unbounded:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Agendex Pro — One dashboard for every coding agent</title>
  </head>
  <body>
    <script>
      (() => {
        var t = localStorage.getItem("agendex.theme") || "system";
        var d = t === "system"
          ? window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
          : t;
        document.documentElement.classList.add(d);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
