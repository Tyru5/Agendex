name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for CLI-relevant changes
        id: cli-changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/main...HEAD | grep -qE '^packages/(cli|shared)/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require changeset on PRs
        if: github.event_name == 'pull_request' && steps.cli-changes.outputs.changed == 'true' && !startsWith(github.head_ref, 'changeset-release/')
        run: bunx changeset status --since=origin/main

      - name: Format and lint
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test (Bun suite + Convex vitest)
        run: bun run test

      - name: Build CLI release artifact
        run: bun run build:cli:release

      - name: Pack CLI release artifact
        run: bun run pack:cli:dry-run

      - name: Smoke test packed CLI
        run: bun run smoke:cli:release
