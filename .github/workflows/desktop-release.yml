name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 1.0.0 or desktop-v1.0.0)'
        required: true
        type: string
      platform:
        description: 'Platforms to build and publish'
        required: true
        type: choice
        options:
          - all
          - mac
          - win
        default: all
  push:
    tags:
      - 'desktop-v*.*.*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.release_name }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      ref: ${{ github.sha }}
      platform: ${{ steps.platform.outputs.platform }}
      build_macos: ${{ steps.platform.outputs.build_macos }}
      build_windows: ${{ steps.platform.outputs.build_windows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - id: release_meta
        name: Resolve release metadata
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: node scripts/prepare-desktop-release.mjs "$RAW_VERSION" --github-output

      # Tag pushes always release every platform. Manual dispatch may target one
      # (e.g. attach an unsigned Windows build to a tag that already shipped macOS,
      # without paying for another notarization round trip).
      - id: platform
        name: Resolve target platforms
        env:
          RAW_PLATFORM: ${{ github.event.inputs.platform || 'all' }}
        run: |
          set -euo pipefail
          platform="${RAW_PLATFORM:-all}"
          case "$platform" in
            all|mac|win) ;;
            *)
              echo "::error::Invalid platform '${platform}'. Expected all, mac, or win."
              exit 1
              ;;
          esac

          build_macos=false
          build_windows=false
          if [[ "$platform" == "all" || "$platform" == "mac" ]]; then
            build_macos=true
          fi
          if [[ "$platform" == "all" || "$platform" == "win" ]]; then
            build_windows=true
          fi

          {
            echo "platform=${platform}"
            echo "build_macos=${build_macos}"
            echo "build_windows=${build_windows}"
          } >>"$GITHUB_OUTPUT"

          echo "Release platform selection: ${platform} (macOS=${build_macos}, Windows=${build_windows})"

      # Stable releases: bump /download on main before platform builds start so
      # the marketing page points at this tag's asset URLs. Prereleases skip
      # (prepare-desktop-release only rewrites DESKTOP_VERSION when make_latest).
      - name: Update download page on main
        if: steps.release_meta.outputs.make_latest == 'true'
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          WORKDIR="$(mktemp -d)"
          cleanup() { rm -rf "$WORKDIR"; }
          trap cleanup EXIT

          # Clone main separately so the release checkout (tag SHA) stays intact
          # for lint/tests and for the platform build jobs that depend on preflight.
          git clone --depth 1 --branch main \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$WORKDIR"

          cd "$WORKDIR"
          node scripts/prepare-desktop-release.mjs "$VERSION" --write
          # Packaging version is aligned ephemerally on runners; never commit it.
          git checkout -- packages/desktop/package.json

          PAGE='packages/web/src/client/components/DownloadPage.tsx'
          if git diff --quiet -- "$PAGE"; then
            echo "Download page on main already targets v${VERSION}"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PAGE"
          git commit -m "chore(web): bump desktop download version to ${VERSION}"

          # Retry once on a racing main push.
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi

          echo "Pushed download page update to main for v${VERSION}"

      - name: Check formatting and lint
        run: bun run check

      - name: Run desktop-related tests
        run: bun test packages/desktop packages/shared/src/convex-url.test.ts packages/shared/src/desktop-auth-callback.test.ts packages/ee/src/lib/desktop.test.ts packages/ee/src/lib/desktop-auth-flow.test.ts packages/ee/src/lib/cli-auth-callback.test.ts packages/ee/src/lib/cloud-query-mode.test.ts scripts/prepare-desktop-release.test.mjs

  build-macos:
    name: Build macOS (signed)
    needs: preflight
    if: needs.preflight.outputs.build_macos == 'true'
    runs-on: macos-latest
    # Generous limit: Apple notarization can stall for an hour+ during queue backlogs.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Align desktop package version
        run: node scripts/prepare-desktop-release.mjs "${{ needs.preflight.outputs.version }}" --write

      - name: Build desktop app
        run: bun run desktop:build

      - name: Prepare notarization key
        shell: bash
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_API_KEY_B64:-}" ]]; then
            echo "APPLE_API_KEY is not set; skipping App Store Connect API key decode."
            exit 0
          fi

          key_id="${APPLE_API_KEY_ID:-AuthKey}"
          key_path="$RUNNER_TEMP/AuthKey_${key_id}.p8"
          if printf '%s' "$APPLE_API_KEY_B64" | base64 --decode >"$key_path" 2>/dev/null; then
            :
          else
            printf '%s' "$APPLE_API_KEY_B64" | base64 -D >"$key_path"
          fi
          echo "APPLE_API_KEY=$key_path" >>"$GITHUB_ENV"

      - name: Verify macOS signing secrets
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CSC_LINK:-}" ]] || missing+=(CSC_LINK)
          [[ -n "${CSC_KEY_PASSWORD:-}" ]] || missing+=(CSC_KEY_PASSWORD)

          has_api_key=false
          if [[ -n "${APPLE_API_KEY:-}" && -n "${APPLE_API_KEY_ID:-}" && -n "${APPLE_API_ISSUER:-}" ]]; then
            has_api_key=true
          fi

          has_apple_id=false
          if [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]]; then
            has_apple_id=true
          fi

          if [[ "$has_api_key" != "true" && "$has_apple_id" != "true" ]]; then
            missing+=(APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER)
          fi

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing macOS signing/notarization secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Package macOS desktop artifact
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run --cwd packages/desktop dist -- --mac --universal

      # electron-builder notarizes the .app before creating the DMG, so Apple
      # has no ticket for the final disk-image hash. Submit the completed DMG,
      # wait for its ticket, then staple it for offline Gatekeeper assessment.
      - name: Notarize and staple DMG
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in packages/desktop/release/*.dmg; do
            echo "Notarizing $dmg"
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            echo "Stapling $dmg"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob

          for pattern in \
            "packages/desktop/release/*.dmg" \
            "packages/desktop/release/*.zip" \
            "packages/desktop/release/*.blockmap" \
            "packages/desktop/release/*.yml"; do
            for file in $pattern; do
              case "$(basename "$file")" in
                builder-debug.yml) continue ;;
              esac
              cp "$file" release-publish/
            done
          done

          ls -lah release-publish

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: release-publish/*
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    needs: preflight
    if: needs.preflight.outputs.build_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      # What the packaging step actually did, so the release notes describe the
      # artifacts rather than assuming.
      signed: ${{ steps.package.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Daemon lifecycle and PID handling diverge most on Windows, so re-run
      # those suites on the real OS before shipping the installer.
      - name: Run Windows daemon process tests
        run: bun test packages/desktop/src/main/desktop-daemon-manager.test.ts packages/desktop/src/main/desktop-daemon-protocol.test.ts packages/cli/src/pid.test.ts packages/cli/src/cli-daemon-lifecycle.test.ts packages/shared/src/config.test.ts

      - name: Align desktop package version
        run: node scripts/prepare-desktop-release.mjs "${{ needs.preflight.outputs.version }}" --write

      - name: Build desktop app
        run: bun run desktop:build

      # Signing is optional. Without WIN_CSC_* secrets, electron-builder ships an
      # unsigned installer (SmartScreen will warn; users can Run anyway).
      #
      # Important: do NOT pass empty CSC_LINK into the env block. GitHub Actions
      # still injects empty strings for missing secrets, and electron-builder
      # then treats "" as a cert path (resolves to the project dir) and fails
      # with: "Env WIN_CSC_LINK is not correct, cannot resolve: ... not a file".
      - name: Package Windows desktop artifacts
        id: package
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WIN_CSC_LINK:-}" && -n "${WIN_CSC_KEY_PASSWORD:-}" ]]; then
            export CSC_LINK="$WIN_CSC_LINK"
            export CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"
            signed=true
            echo "Windows signing credentials found; packaging a signed installer."
          elif [[ -n "${WIN_CSC_LINK:-}" || -n "${WIN_CSC_KEY_PASSWORD:-}" ]]; then
            echo "::error::Partial Windows signing credentials: set both WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD."
            exit 1
          else
            unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true
            signed=false
            echo "::warning::No Windows signing credentials; packaging an unsigned installer (SmartScreen will warn)."
          fi
          echo "signed=${signed}" >>"$GITHUB_OUTPUT"
          bun run --cwd packages/desktop dist -- --win --x64

      - name: Verify distinct Windows artifacts
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem packages/desktop/release -Filter 'Agendex-*-x64-Setup.exe')
          $portable = @(Get-ChildItem packages/desktop/release -Filter 'Agendex-*-x64-Portable.exe')
          if ($setup.Count -ne 1) {
            throw "Expected one NSIS setup executable, found $($setup.Count)"
          }
          if ($portable.Count -ne 1) {
            throw "Expected one portable executable, found $($portable.Count)"
          }

      # latest.yml is the electron-updater feed for Windows. Without it the
      # generic provider 404s and installed clients silently stop updating.
      - name: Verify Windows update feed
        shell: pwsh
        run: |
          $feed = 'packages/desktop/release/latest.yml'
          if (-not (Test-Path $feed)) {
            throw "electron-builder did not emit $feed"
          }
          Get-Content $feed

      - name: Smoke packaged Electron daemon lifecycle
        shell: pwsh
        run: |
          $app = (Get-Item 'packages/desktop/release/win-unpacked/Agendex.exe').FullName
          bun packages/desktop/scripts/smoke-daemon-worker.mjs --app $app

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob

          for pattern in \
            "packages/desktop/release/*.exe" \
            "packages/desktop/release/*.blockmap" \
            "packages/desktop/release/*.yml"; do
            for file in $pattern; do
              case "$(basename "$file")" in
                builder-debug.yml) continue ;;
              esac
              cp "$file" release-publish/
            done
          done

          ls -lah release-publish

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [preflight, build-macos, build-windows]
    # Publish when every selected platform succeeded. Skipped platforms (via
    # platform=mac or platform=win) are allowed; a failed selected build still
    # blocks publish so a release never ships half its artifacts.
    if: >-
      always() &&
      !cancelled() &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-publish

      - name: List release assets
        run: ls -lah release-publish

      # A single-platform run leaves the other platform's existing assets in
      # place, so the notes describe what the release *ends up* holding, not
      # just what this run built.
      - name: Compose release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          # 'true'/'false' from this run's packaging step; empty when Windows was
          # not rebuilt (platform=mac) and the .exe assets predate this run.
          WIN_SIGNED: ${{ needs.build-windows.outputs.signed }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          has_mac=false
          has_win=false
          [[ -n "$(echo release-publish/*.dmg)" ]] && has_mac=true
          [[ -n "$(echo release-publish/*.exe)" ]] && has_win=true

          existing="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          grep -q '\.dmg$' <<<"$existing" && has_mac=true
          grep -q '\.exe$' <<<"$existing" && has_win=true

          {
            if [[ "$has_mac" == "true" && "$has_win" == "true" ]]; then
              echo "Agendex Desktop v${VERSION} for macOS (universal) and Windows (x64)."
            elif [[ "$has_mac" == "true" ]]; then
              echo "Agendex Desktop v${VERSION} for macOS (universal)."
            else
              echo "Agendex Desktop v${VERSION} for Windows (x64)."
            fi

            if [[ "$has_mac" == "true" ]]; then
              cat <<'EOF'

          ## macOS

          Signed and notarized. Download the `.dmg` for the standard install flow, or the `.zip` if you prefer to drag the app into Applications yourself.

          Verify (optional):

          ```bash
          codesign --verify --deep --strict --verbose=2 "/Applications/Agendex.app"
          spctl -a -vv "/Applications/Agendex.app"
          ```
          EOF
            fi

            if [[ "$has_win" == "true" ]]; then
              printf '\n## Windows\n\n'

              # Only claim a signing status this run can vouch for. When Windows
              # was not rebuilt, say nothing rather than guess.
              case "${WIN_SIGNED:-}" in
                false)
                  cat <<'EOF'
          **This build is not code-signed.** Windows SmartScreen will show "Windows protected your PC" — choose **More info → Run anyway** to continue. A signing certificate is planned.

          EOF
                  ;;
                true)
                  cat <<'EOF'
          Signed with an Authenticode certificate.

          EOF
                  ;;
              esac

              cat <<'EOF'
          - `*-x64-Setup.exe` — installer. Creates shortcuts, registers the `agendex://` sign-in link, and updates itself in place.
          - `*-x64-Portable.exe` — single-file build that needs no install. It cannot self-update; re-download to upgrade.
          EOF
            fi
          } >release-notes.md

          cat release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: ${{ needs.preflight.outputs.release_name }}
          files: release-publish/*
          draft: false
          prerelease: ${{ needs.preflight.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.preflight.outputs.make_latest == 'true' }}
          generate_release_notes: true
          body_path: release-notes.md
