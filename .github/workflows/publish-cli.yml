name: Publish CLI

on:
  push:
    branches:
      - main

concurrency:
  group: publish-cli
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup npm for trusted publishing
        run: npm install --global npm@11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI release artifact
        run: bun run build:cli:release

      - name: Pack CLI release artifact
        run: bun run pack:cli:dry-run

      - name: Smoke test packed CLI
        run: bun run smoke:cli:release

      - name: Check published version
        id: version
        run: |
          LOCAL_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('./packages/cli/package.json', 'utf8')).version")
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          # The release tag is created only after publish succeeds. npm metadata
          # can lag behind that success and make a subsequent push publish twice.
          RELEASE_TAG=$(git ls-remote --tags origin "refs/tags/v$LOCAL_VERSION")
          if [ -n "$RELEASE_TAG" ]; then
            echo "Release v$LOCAL_VERSION already tagged, skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NPM_VIEW_ERR=$(mktemp)
          if PUBLISHED_VERSION=$(npm view agendex-cli version 2>"$NPM_VIEW_ERR"); then
            :
          elif grep -Eq 'E404|404 Not Found' "$NPM_VIEW_ERR"; then
            PUBLISHED_VERSION=""
          else
            cat "$NPM_VIEW_ERR" >&2
            rm -f "$NPM_VIEW_ERR"
            exit 1
          fi
          rm -f "$NPM_VIEW_ERR"
          echo "published=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.version.outputs.publish == 'true'
        run: npm publish ./packages/cli/.release --access public --provenance

      - name: Tag release
        if: steps.version.outputs.publish == 'true'
        run: |
          TAG="v${{ steps.version.outputs.local }}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
