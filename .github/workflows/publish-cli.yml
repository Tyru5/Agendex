name: Publish CLI

on:
  push:
    branches:
      - main

concurrency:
  group: publish-cli
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup npm for trusted publishing
        run: npm install --global npm@11

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI release artifact
        run: bun run build:cli:release

      - name: Pack CLI release artifact
        run: bun run pack:cli:dry-run

      - name: Smoke test packed CLI
        run: bun run smoke:cli:release

      - name: Check published version
        id: version
        run: |
          LOCAL_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('./packages/cli/package.json', 'utf8')).version")
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          # The release tag is created only after publish succeeds. npm metadata
          # can lag behind that success and make a subsequent push publish twice.
          RELEASE_TAG=$(git ls-remote --tags origin "refs/tags/v$LOCAL_VERSION")
          if [ -n "$RELEASE_TAG" ]; then
            echo "Release v$LOCAL_VERSION already tagged, skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tagged=false" >> "$GITHUB_OUTPUT"
          NPM_VIEW_ERR=$(mktemp)
          if PUBLISHED_VERSION=$(npm view agendex-cli version 2>"$NPM_VIEW_ERR"); then
            :
          elif grep -Eq 'E404|404 Not Found' "$NPM_VIEW_ERR"; then
            PUBLISHED_VERSION=""
          else
            cat "$NPM_VIEW_ERR" >&2
            rm -f "$NPM_VIEW_ERR"
            exit 1
          fi
          rm -f "$NPM_VIEW_ERR"
          echo "published=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Idempotent: a retry after a later step failed can see stale npm metadata
      # and land here for an already-published version; let it fall through to JSR.
      - name: Publish package
        if: steps.version.outputs.publish == 'true'
        run: |
          set -o pipefail
          NPM_PUBLISH_LOG=$(mktemp)
          if npm publish ./packages/cli/.release --access public --provenance 2>&1 | tee "$NPM_PUBLISH_LOG"; then
            exit 0
          fi
          if grep -Eq 'EPUBLISHCONFLICT|cannot publish over the previously published version' "$NPM_PUBLISH_LOG"; then
            echo "agendex-cli@${{ steps.version.outputs.local }} already on npm; continuing."
            exit 0
          fi
          exit 1

      # Checked against JSR itself, after npm, so a JSR outage never blocks the
      # npm release and a JSR failure is retried on the next push (no tag yet).
      - name: Check JSR version
        id: jsr
        if: steps.version.outputs.tagged == 'false'
        run: |
          LOCAL_VERSION="${{ steps.version.outputs.local }}"
          JSR_STATUS=$(curl -sS -o jsr-meta.json -w '%{http_code}' https://jsr.io/@agendex/cli/meta.json)
          if [ "$JSR_STATUS" = "404" ]; then
            JSR_HAS_VERSION=false
          elif [ "$JSR_STATUS" = "200" ]; then
            JSR_HAS_VERSION=$(node -p "Object.hasOwn(JSON.parse(require('node:fs').readFileSync('jsr-meta.json', 'utf8')).versions ?? {}, process.argv[1])" "$LOCAL_VERSION")
          else
            echo "Unexpected JSR meta status $JSR_STATUS" >&2
            exit 1
          fi
          rm -f jsr-meta.json
          if [ "$JSR_HAS_VERSION" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # cli.ts imports the same-version npm package, so this runs after npm
      # publish and retries while the registry propagates. Published from
      # outside the repo: in-tree, Deno resolves npm:agendex-cli to the local
      # workspace package instead of the registry.
      - name: Publish to JSR
        if: steps.jsr.outputs.publish == 'true'
        run: |
          JSR_DIR="$RUNNER_TEMP/jsr-cli"
          mkdir -p "$JSR_DIR"
          cp packages/cli/.release/{cli.ts,jsr.json,README.md,LICENSE} "$JSR_DIR/"
          cd "$JSR_DIR"
          for attempt in 1 2 3 4 5; do
            deno publish --allow-dirty && exit 0
            echo "JSR publish attempt $attempt failed; retrying in 30s." >&2
            sleep 30
          done
          exit 1

      - name: Tag release
        # Untagged and every prior step succeeded: npm and JSR both have it.
        if: steps.version.outputs.tagged == 'false'
        run: |
          TAG="v${{ steps.version.outputs.local }}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
