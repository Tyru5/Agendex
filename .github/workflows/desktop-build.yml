name: Build Desktop (CI)

on:
  pull_request:
    paths:
      - 'packages/desktop/**'
      - 'packages/cli/**'
      - 'packages/ee/**'
      - 'packages/shared/**'
      - 'packages/app/**'
      - 'scripts/prepare-desktop-release.mjs'
      - 'scripts/build-test-desktop.sh'
      - '.github/workflows/desktop-build.yml'
      - 'package.json'
      - 'bun.lock'
  push:
    branches: [main]
    paths:
      - 'packages/desktop/**'
      - 'packages/cli/**'
      - 'packages/ee/**'
      - 'packages/shared/**'
      - 'packages/app/**'
      - 'scripts/prepare-desktop-release.mjs'
      - 'scripts/build-test-desktop.sh'
      - '.github/workflows/desktop-build.yml'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run check

      - name: Run desktop-related tests
        run: bun test packages/desktop packages/shared/src/convex-url.test.ts packages/shared/src/desktop-auth-callback.test.ts packages/ee/src/lib/desktop.test.ts packages/ee/src/lib/desktop-auth-flow.test.ts packages/ee/src/lib/cli-auth-callback.test.ts packages/ee/src/lib/cloud-query-mode.test.ts

  build-macos:
    name: Package macOS (unsigned)
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop app
        run: bun run desktop:build

      - name: Package macOS desktop artifact (unsigned)
        run: bun run --cwd packages/desktop dist -- --mac --universal

      - name: Collect build assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-output
          shopt -s nullglob

          for pattern in \
            "packages/desktop/release/*.dmg" \
            "packages/desktop/release/*.zip" \
            "packages/desktop/release/*.blockmap" \
            "packages/desktop/release/*.yml"; do
            for file in $pattern; do
              case "$(basename "$file")" in
                builder-debug.yml) continue ;;
              esac
              cp "$file" build-output/
            done
          done

          ls -lah build-output

      - name: Upload build assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-unsigned
          path: build-output/*
          if-no-files-found: error

  build-windows:
    name: Package Windows (unsigned)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Windows daemon process tests
        run: bun test packages/desktop/src/main/desktop-daemon-manager.test.ts packages/desktop/src/main/desktop-daemon-protocol.test.ts packages/cli/src/pid.test.ts

      - name: Build desktop app
        run: bun run desktop:build

      - name: Package Windows desktop artifacts
        run: bun run --cwd packages/desktop dist -- --win --x64

      - name: Verify distinct Windows artifacts
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem packages/desktop/release -Filter 'Agendex-*-x64-Setup.exe')
          $portable = @(Get-ChildItem packages/desktop/release -Filter 'Agendex-*-x64-Portable.exe')
          if ($setup.Count -ne 1) {
            throw "Expected one NSIS setup executable, found $($setup.Count)"
          }
          if ($portable.Count -ne 1) {
            throw "Expected one portable executable, found $($portable.Count)"
          }

      - name: Upload Windows build assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-unsigned
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.blockmap
            packages/desktop/release/*.yml
          if-no-files-found: error
